<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corrections Review — Lucentive Club</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 32px 24px;
    }

    header { max-width: 960px; margin: 0 auto 24px; }
    header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    header p  { font-size: 14px; color: #666; }

    .stats {
      display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap;
    }
    .stat {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
      padding: 10px 18px; font-size: 13px; color: #444;
    }
    .stat strong { font-size: 20px; font-weight: 700; color: #111; display: block; margin-bottom: 2px; }
    .stat.s-done strong    { color: #2e7d32; }
    .stat.s-pending strong { color: #e65100; }

    .controls {
      max-width: 960px; margin: 0 auto 16px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .controls input[type="text"] {
      flex: 1; padding: 9px 14px; border: 1px solid #ccc;
      border-radius: 8px; font-size: 14px; outline: none; min-width: 200px;
    }
    .controls input:focus { border-color: #555; }

    .btn-primary {
      padding: 9px 18px; background: #111; color: #fff;
      border: none; border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .btn-primary:hover { background: #333; }

    .tabs {
      max-width: 960px; margin: 0 auto 20px;
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .tab {
      padding: 7px 18px; border-radius: 20px; border: 1px solid #ccc;
      background: #fff; font-size: 13px; cursor: pointer;
      font-weight: 500; color: #555;
    }
    .tab:hover  { border-color: #999; color: #111; }
    .tab.active { background: #111; color: #fff; border-color: #111; }

    .card-list {
      max-width: 960px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 16px;
    }

    .card {
      background: #fff; border: 2px solid #e0e0e0;
      border-radius: 12px; overflow: hidden;
      transition: border-color 0.15s;
    }
    .card.done    { border-color: #66bb6a; }
    .card.hidden  { display: none; }

    /* Card header */
    .card-header {
      padding: 14px 18px 12px;
      border-bottom: 1px solid #f0f0f0;
      display: flex; gap: 12px; align-items: flex-start;
    }
    .card-meta { flex: 1; }
    .card-num {
      font-size: 11px; color: #999; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
    }
    .card-phone { font-size: 13px; color: #888; margin-top: 2px; }

    .reviewer-note {
      font-size: 15px; font-weight: 600; color: #111; line-height: 1.4;
    }

    /* Category selector */
    .cat-wrap { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 2px; }
    .cat-btn {
      padding: 4px 12px; border-radius: 20px; border: 1.5px solid #ddd;
      background: #fff; font-size: 12px; font-weight: 500;
      cursor: pointer; color: #555; transition: all 0.12s;
    }
    .cat-btn:hover { border-color: #999; color: #111; }
    .cat-btn.active { color: #fff; border-color: transparent; }

    .cat-btn[data-cat="identity"]       { --c: #7b1fa2; }
    .cat-btn[data-cat="stall"]          { --c: #e65100; }
    .cat-btn[data-cat="wording"]        { --c: #1565c0; }
    .cat-btn[data-cat="wrong-data"]     { --c: #c62828; }
    .cat-btn[data-cat="routing"]        { --c: #2e7d32; }
    .cat-btn[data-cat="context-miss"]   { --c: #5d4037; }
    .cat-btn[data-cat="response-length"]{ --c: #00695c; }
    .cat-btn[data-cat="regulation"]     { --c: #f57f17; }
    .cat-btn.active { background: var(--c); border-color: var(--c); }

    /* Conversation context */
    .card-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }

    .section-label {
      font-size: 11px; color: #999; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
    }

    .chat-window {
      background: #fafafa; border: 1px solid #ebebeb;
      border-radius: 8px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .msg { display: flex; flex-direction: column; gap: 2px; }
    .msg-role {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .msg.user .msg-role  { color: #1565c0; }
    .msg.bot .msg-role   { color: #555; }
    .msg.flagged .msg-role { color: #c62828; }

    .msg-text {
      font-size: 13.5px; line-height: 1.55; color: #333;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.flagged .msg-text {
      background: #fff3e0; border-left: 3px solid #e65100;
      padding: 6px 10px; border-radius: 0 6px 6px 0;
    }
    .flagged-label {
      font-size: 11px; color: #e65100; font-weight: 600;
      margin-top: 2px;
    }

    /* Original / Correct diff */
    .diff-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    @media (max-width: 640px) { .diff-row { grid-template-columns: 1fr; } }

    .diff-box {
      border-radius: 8px; padding: 10px 14px;
    }
    .diff-box.original { background: #fff5f5; border: 1px solid #ffcdd2; }
    .diff-box.correct  { background: #f1f8e9; border: 1px solid #c5e1a5; }
    .diff-box .diff-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 5px;
    }
    .diff-box.original .diff-label { color: #c62828; }
    .diff-box.correct  .diff-label { color: #2e7d32; }
    .diff-box p { font-size: 13.5px; color: #333; line-height: 1.55; white-space: pre-wrap; }

    /* Action plan */
    .action-section { display: flex; flex-direction: column; gap: 6px; }
    .action-textarea {
      width: 100%; min-height: 72px; padding: 9px 12px;
      border: 1.5px solid #ddd; border-radius: 8px;
      font-size: 13.5px; font-family: inherit; line-height: 1.5;
      color: #222; resize: vertical; outline: none;
    }
    .action-textarea:focus { border-color: #555; }
    .action-textarea::placeholder { color: #aaa; }

    .card-footer {
      padding: 10px 18px; border-top: 1px solid #f0f0f0;
      display: flex; gap: 8px; align-items: center; justify-content: space-between;
    }
    .cat-badge {
      font-size: 12px; font-weight: 600; padding: 3px 10px;
      border-radius: 20px; background: #eee; color: #555;
    }

    .btn-done {
      padding: 6px 18px; border-radius: 8px;
      border: 1.5px solid #4caf50; color: #2e7d32;
      background: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.12s;
    }
    .btn-done:hover   { background: #e8f5e9; }
    .btn-done.active  { background: #4caf50; color: #fff; border-color: #4caf50; }

    .no-results {
      color: #999; font-size: 15px; padding: 40px; text-align: center; display: none;
    }
  </style>
</head>
<body>

<header>
  <h1>Corrections Review — Agent Behaviour</h1>
  <p>Assign a category to each correction, add an action note, then mark as Done. Export when ready to action changes.</p>

    <div class="stat"><strong id="cnt-total">—</strong>Total</div>
    <div class="stat s-done"><strong id="cnt-done">0</strong>Done</div>

  <button class="tab"        data-tab="context-miss"    onclick="setTab(this)">Context Miss</button>
  <button class="tab"        data-tab="response-length" onclick="setTab(this)">Too Long</button>
  <button class="tab"        data-tab="regulation"      onclick="setTab(this)">Regulation</button>
</div>

<div class="card-list" id="card-list"></div>
<div class="no-results" id="no-results">No corrections match your filter.</div>

// ── State ──────────────────────────────────────────────────────────────────
const STORE = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE)); }
function stateFor(id) { return STORE[id] || (STORE[id] = { cat: null, action: "", done: false }); }

// ── Rendering ──────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderChat(ctx) {
  return ctx.map(m => {
    const cls = m.flagged ? "msg flagged" : `msg ${m.role}`;
    const roleLabel = m.role === "user" ? "User" : "Bot";
    const flag = m.flagged ? `<div class="flagged-label">▲ Flagged</div>` : "";
    return `<div class="${cls}">
      <div class="msg-role">${roleLabel}</div>
      <div class="msg-text">${escHtml(m.text)}</div>
      ${flag}
    </div>`;
  }).join("");
}

function renderCatBtns(id) {
  const current = stateFor(id).cat;
  return CATEGORIES.map(c => {
    const active = current === c.id ? " active" : "";
    return `<button class="cat-btn${active}" data-cat="${c.id}" onclick="setCat('${id}','${c.id}')">${c.label}</button>`;
  }).join("");
}

function catLabel(catId) {
  const c = CATEGORIES.find(x => x.id === catId);
  return c ? c.label : "—";
}

function render() {
  const list = document.getElementById("card-list");
  list.innerHTML = "";

  corrections.forEach((c, i) => {
    const st = stateFor(c.id);
    const el = document.createElement("div");
    el.className = "card" + (st.done ? " done" : "");
    el.dataset.id = c.id;
    el.dataset.cat = st.cat || "";

    const hasDiff = c.correct && c.correct !== "." && c.correct !== "...";

    el.innerHTML = `
      <div class="card-header">
        <div class="card-meta">
          <div class="card-num">Correction ${i+1} of ${corrections.length} · ${c.thread.slice(0,12)}</div>
          <div class="reviewer-note">${escHtml(c.reviewerNote)}</div>
          <div class="card-phone">${escHtml(c.phone)}</div>
        </div>
      </div>

      <div class="card-body">

        <div>
          <div class="section-label">Category</div>
          <div class="cat-wrap">${renderCatBtns(c.id)}</div>
        </div>

        <div>
          <div class="section-label">Conversation context</div>
          <div class="chat-window">${renderChat(c.context)}</div>
        </div>

        ${hasDiff ? `
        <div class="diff-row">
          <div class="diff-box original">
            <div class="diff-label">Wrong response</div>
            <p>${escHtml(c.original)}</p>
          </div>
          <div class="diff-box correct">
            <div class="diff-label">Correct response</div>
            <p>${escHtml(c.correct)}</p>
          </div>
        </div>` : `
        <div class="diff-box original" style="grid-column:span 2">
          <div class="diff-label">Wrong response</div>
          <p>${escHtml(c.original)}</p>
        </div>`}

        <div class="action-section">
          <div class="section-label">Action plan</div>
          <textarea class="action-textarea"
            placeholder="What change needs to be made? Which file? What wording?"
            oninput="saveAction('${c.id}', this.value)"
          >${escHtml(st.action)}</textarea>
        </div>

      </div>

      <div class="card-footer">
        <span class="cat-badge" id="badge-${c.id}">${catLabel(st.cat)}</span>
        <button class="btn-done${st.done ? " active" : ""}" onclick="toggleDone('${c.id}')">
          ${st.done ? "✓ Done" : "Mark Done"}
        </button>
      </div>
    `;

    list.appendChild(el);
  });

  updateStats();
  applyFilters();
}

// ── Actions ────────────────────────────────────────────────────────────────
function setCat(id, cat) {
  const st = stateFor(id);
  st.cat = st.cat === cat ? null : cat;
  save();
  // Re-render just this card's buttons + badge
  const el = document.querySelector(`.card[data-id="${id}"]`);
  el.dataset.cat = st.cat || "";
  el.querySelector(".cat-wrap").innerHTML = renderCatBtns(id);
  document.getElementById(`badge-${id}`).textContent = catLabel(st.cat);
  applyFilters();
}

function saveAction(id, val) {
  stateFor(id).action = val;
  save();
}

function toggleDone(id) {
  const st = stateFor(id);
  st.done = !st.done;
  save();
  const el = document.querySelector(`.card[data-id="${id}"]`);
  el.classList.toggle("done", st.done);
  const btn = el.querySelector(".btn-done");
  btn.classList.toggle("active", st.done);
  btn.textContent = st.done ? "✓ Done" : "Mark Done";
  updateStats();
  applyFilters();
}

// ── Filters ────────────────────────────────────────────────────────────────
let activeTab = "all";

function setTab(btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  activeTab = btn.dataset.tab;
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById("search").value.toLowerCase();
  let visible = 0;
  document.querySelectorAll(".card").forEach(el => {
    const id  = el.dataset.id;
    const cat = el.dataset.cat;
    const st  = stateFor(id);
    const c   = corrections.find(x => x.id === id);
    const text = (c.reviewerNote + " " + c.original + " " + c.correct + " " + st.action).toLowerCase();

    let show = true;
    if (q && !text.includes(q)) show = false;
    if (activeTab === "pending" && st.done) show = false;
    if (activeTab === "done"    && !st.done) show = false;
    if (!["all","pending","done"].includes(activeTab) && cat !== activeTab) show = false;

    el.classList.toggle("hidden", !show);
    if (show) visible++;
  });
  document.getElementById("no-results").style.display = visible === 0 ? "block" : "none";
}

function updateStats() {
  const done    = corrections.filter(c => stateFor(c.id).done).length;
  const pending = corrections.length - done;
  document.getElementById("cnt-total").textContent   = corrections.length;
  document.getElementById("cnt-done").textContent    = done;
  document.getElementById("cnt-pending").textContent = pending;
}

// ── Export ─────────────────────────────────────────────────────────────────
function exportDone() {
  const out = corrections
    .filter(c => stateFor(c.id).done)
    .map(c => ({
      id:           c.id,
      thread:       c.thread,
      phone:        c.phone,
      category:     stateFor(c.id).cat,
      reviewerNote: c.reviewerNote,
      original:     c.original,
      correct:      c.correct,
      action:       stateFor(c.id).action,
    }));

  if (out.length === 0) { alert("Mark some corrections as Done first."); return; }

  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url; a.download = "corrections_actioned.json"; a.click();
  URL.revokeObjectURL(url);
}

render();
</script>
</body>
</html>
