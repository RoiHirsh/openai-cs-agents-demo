<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corrections Review — Lucentive Club</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 32px 24px;
    }

    header { max-width: 960px; margin: 0 auto 24px; }
    header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    header p  { font-size: 14px; color: #666; }

    .stats {
      display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap;
    }
    .stat {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
      padding: 10px 18px; font-size: 13px; color: #444;
    }
    .stat strong { font-size: 20px; font-weight: 700; color: #111; display: block; margin-bottom: 2px; }
    .stat.s-done strong    { color: #2e7d32; }
    .stat.s-pending strong { color: #e65100; }

    .controls {
      max-width: 960px; margin: 0 auto 16px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .controls input[type="text"] {
      flex: 1; padding: 9px 14px; border: 1px solid #ccc;
      border-radius: 8px; font-size: 14px; outline: none; min-width: 200px;
    }
    .controls input:focus { border-color: #555; }

    .btn-primary {
      padding: 9px 18px; background: #111; color: #fff;
      border: none; border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .btn-primary:hover { background: #333; }

    .tabs {
      max-width: 960px; margin: 0 auto 20px;
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .tab {
      padding: 7px 18px; border-radius: 20px; border: 1px solid #ccc;
      background: #fff; font-size: 13px; cursor: pointer;
      font-weight: 500; color: #555;
    }
    .tab:hover  { border-color: #999; color: #111; }
    .tab.active { background: #111; color: #fff; border-color: #111; }

    .card-list {
      max-width: 960px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 16px;
    }

    .card {
      background: #fff; border: 2px solid #e0e0e0;
      border-radius: 12px; overflow: hidden;
      transition: border-color 0.15s;
    }
    .card.done    { border-color: #66bb6a; }
    .card.hidden  { display: none; }

    /* Card header */
    .card-header {
      padding: 14px 18px 12px;
      border-bottom: 1px solid #f0f0f0;
      display: flex; gap: 12px; align-items: flex-start;
    }
    .card-meta { flex: 1; }
    .card-num {
      font-size: 11px; color: #999; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
    }
    .card-phone { font-size: 13px; color: #888; margin-top: 2px; }

    .reviewer-note {
      font-size: 15px; font-weight: 600; color: #111; line-height: 1.4;
    }

    /* Category selector */
    .cat-wrap { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 2px; }
    .cat-btn {
      padding: 4px 12px; border-radius: 20px; border: 1.5px solid #ddd;
      background: #fff; font-size: 12px; font-weight: 500;
      cursor: pointer; color: #555; transition: all 0.12s;
    }
    .cat-btn:hover { border-color: #999; color: #111; }
    .cat-btn.active { color: #fff; border-color: transparent; }

    .cat-btn[data-cat="identity"]       { --c: #7b1fa2; }
    .cat-btn[data-cat="stall"]          { --c: #e65100; }
    .cat-btn[data-cat="wording"]        { --c: #1565c0; }
    .cat-btn[data-cat="wrong-data"]     { --c: #c62828; }
    .cat-btn[data-cat="routing"]        { --c: #2e7d32; }
    .cat-btn[data-cat="context-miss"]   { --c: #5d4037; }
    .cat-btn[data-cat="response-length"]{ --c: #00695c; }
    .cat-btn[data-cat="regulation"]     { --c: #f57f17; }
    .cat-btn.active { background: var(--c); border-color: var(--c); }

    /* Conversation context */
    .card-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }

    .section-label {
      font-size: 11px; color: #999; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
    }

    .chat-window {
      background: #fafafa; border: 1px solid #ebebeb;
      border-radius: 8px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .msg { display: flex; flex-direction: column; gap: 2px; }
    .msg-role {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .msg.user .msg-role  { color: #1565c0; }
    .msg.bot .msg-role   { color: #555; }
    .msg.flagged .msg-role { color: #c62828; }

    .msg-text {
      font-size: 13.5px; line-height: 1.55; color: #333;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.flagged .msg-text {
      background: #fff3e0; border-left: 3px solid #e65100;
      padding: 6px 10px; border-radius: 0 6px 6px 0;
    }
    .flagged-label {
      font-size: 11px; color: #e65100; font-weight: 600;
      margin-top: 2px;
    }

    /* Original / Correct diff */
    .diff-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    @media (max-width: 640px) { .diff-row { grid-template-columns: 1fr; } }

    .diff-box {
      border-radius: 8px; padding: 10px 14px;
    }
    .diff-box.original { background: #fff5f5; border: 1px solid #ffcdd2; }
    .diff-box.correct  { background: #f1f8e9; border: 1px solid #c5e1a5; }
    .diff-box .diff-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 5px;
    }
    .diff-box.original .diff-label { color: #c62828; }
    .diff-box.correct  .diff-label { color: #2e7d32; }
    .diff-box p { font-size: 13.5px; color: #333; line-height: 1.55; white-space: pre-wrap; }

    /* Action plan */
    .action-section { display: flex; flex-direction: column; gap: 6px; }
    .action-textarea {
      width: 100%; min-height: 72px; padding: 9px 12px;
      border: 1.5px solid #ddd; border-radius: 8px;
      font-size: 13.5px; font-family: inherit; line-height: 1.5;
      color: #222; resize: vertical; outline: none;
    }
    .action-textarea:focus { border-color: #555; }
    .action-textarea::placeholder { color: #aaa; }

    .card-footer {
      padding: 10px 18px; border-top: 1px solid #f0f0f0;
      display: flex; gap: 8px; align-items: center; justify-content: space-between;
    }
    .cat-badge {
      font-size: 12px; font-weight: 600; padding: 3px 10px;
      border-radius: 20px; background: #eee; color: #555;
    }

    .btn-done {
      padding: 6px 18px; border-radius: 8px;
      border: 1.5px solid #4caf50; color: #2e7d32;
      background: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.12s;
    }
    .btn-done:hover   { background: #e8f5e9; }
    .btn-done.active  { background: #4caf50; color: #fff; border-color: #4caf50; }

    .no-results {
      color: #999; font-size: 15px; padding: 40px; text-align: center; display: none;
    }

    /* ── View switcher ──────────────────────────────────────── */
    .view-nav {
      max-width: 960px; margin: 0 auto 24px;
      display: flex; gap: 6px;
    }
    .view-btn {
      padding: 8px 22px; border-radius: 8px;
      border: 1.5px solid #ccc; background: #fff;
      font-size: 14px; font-weight: 600; color: #555;
      cursor: pointer; transition: all 0.12s;
    }
    .view-btn:hover { border-color: #888; color: #222; }
    .view-btn.active { background: #111; color: #fff; border-color: #111; }

    /* ── Categories view ────────────────────────────────────── */
    #view-categories { max-width: 960px; margin: 0 auto 40px; }
    .cat-group { margin-bottom: 20px; }
    .cat-group-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; background: #fff;
      border: 1px solid #e0e0e0; border-radius: 10px 10px 0 0;
      border-bottom: 2px solid #111;
    }
    .cat-group-header h2 { font-size: 15px; font-weight: 700; margin: 0; }
    .cat-count {
      font-size: 12px; background: #111; color: #fff;
      padding: 2px 9px; border-radius: 20px; font-weight: 600;
    }
    .cat-items {
      border: 1px solid #e0e0e0; border-top: none;
      border-radius: 0 0 10px 10px; overflow: hidden;
    }
    .cat-item {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 9px 16px; background: #fff;
      border-bottom: 1px solid #f0f0f0; font-size: 13.5px;
    }
    .cat-item:last-child { border-bottom: none; }
    .cat-item-id { font-weight: 700; color: #888; min-width: 28px; flex-shrink: 0; }
    .cat-item-note { color: #222; flex: 1; }

    /* ── Fixes view ─────────────────────────────────────────── */
    #view-fixes { max-width: 1160px; margin: 0 auto 40px; }
    .fixes-table {
      width: 100%; border-collapse: collapse; background: #fff;
      border-radius: 10px; overflow: hidden;
      border: 1px solid #e0e0e0; font-size: 13px;
    }
    .fixes-table th {
      background: #111; color: #fff; font-weight: 600;
      padding: 10px 14px; text-align: left;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .fixes-table td {
      padding: 10px 14px; border-bottom: 1px solid #f0f0f0; vertical-align: top;
    }
    .fixes-table tr:last-child td { border-bottom: none; }
    .fixes-table tr:hover td { background: #fafafa; }
    .fix-id { font-weight: 700; color: #888; white-space: nowrap; }
    .fix-note { color: #444; font-size: 12.5px; line-height: 1.45; max-width: 220px; }
    .fix-cat-select {
      font-size: 12px; padding: 3px 6px; border-radius: 6px;
      border: 1.5px solid #ddd; background: #fff; cursor: pointer;
      outline: none; max-width: 130px;
    }
    .fix-cat-select:focus { border-color: #555; }
    .editable-cell {
      min-height: 38px; padding: 6px 8px; border-radius: 6px;
      border: 1.5px solid transparent; outline: none;
      white-space: pre-wrap; line-height: 1.5; color: #222;
      transition: border-color 0.12s; min-width: 180px;
    }
    .editable-cell:hover { border-color: #ddd; }
    .editable-cell:focus { border-color: #555; background: #fafff7; }
  </style>
</head>
<body>

<header>
  <h1>Corrections Review — Agent Behaviour</h1>
  <p>Assign a category to each correction, add an action note, then mark as Done. Export when ready to action changes.</p>
  <div class="stats">
    <div class="stat"><strong id="cnt-total">—</strong>Total</div>
    <div class="stat s-done"><strong id="cnt-done">0</strong>Done</div>
    <div class="stat s-pending"><strong id="cnt-pending">—</strong>Pending</div>
  </div>
</header>

<div class="view-nav">
  <button class="view-btn active" id="vbtn-list"       onclick="setView('list')">Feedback List</button>
  <button class="view-btn"        id="vbtn-categories" onclick="setView('categories')">By Category</button>
  <button class="view-btn"        id="vbtn-fixes"      onclick="setView('fixes')">Fix Recommendations</button>
</div>

<div id="view-list">
  <div class="controls">
    <input type="text" id="search" placeholder="Search notes, messages…" oninput="applyFilters()" />
    <button class="btn-primary" onclick="exportDone()">Export Done</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="all"     onclick="setTab(this)">All</button>
    <button class="tab"        data-tab="pending" onclick="setTab(this)">Pending</button>
    <button class="tab"        data-tab="done"    onclick="setTab(this)">Done</button>
    <button class="tab"        data-tab="identity"        onclick="setTab(this)">Identity</button>
    <button class="tab"        data-tab="stall"           onclick="setTab(this)">Stall</button>
    <button class="tab"        data-tab="wording"         onclick="setTab(this)">Wording</button>
    <button class="tab"        data-tab="wrong-data"      onclick="setTab(this)">Wrong Data</button>
    <button class="tab"        data-tab="routing"         onclick="setTab(this)">Routing</button>
    <button class="tab"        data-tab="context-miss"    onclick="setTab(this)">Context Miss</button>
    <button class="tab"        data-tab="response-length" onclick="setTab(this)">Too Long</button>
    <button class="tab"        data-tab="regulation"      onclick="setTab(this)">Regulation</button>
    <button class="tab"        data-tab="mt5-copy"        onclick="setTab(this)">MT5/Copy Trading</button>
    <button class="tab"        data-tab="source-unknown"  onclick="setTab(this)">Source Unknown</button>
  </div>

  <div class="card-list" id="card-list"></div>
  <div class="no-results" id="no-results">No corrections match your filter.</div>
</div>

<div id="view-categories" style="display:none">
  <div id="cat-list"></div>
</div>

<div id="view-fixes" style="display:none">
  <div id="fixes-container"></div>
</div>

// ── State ──────────────────────────────────────────────────────────────────
const STORE = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE)); }
function stateFor(id) { return STORE[id] || (STORE[id] = { cat: null, action: "", done: false }); }

// ── Rendering ──────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderChat(ctx) {
  return ctx.map(m => {
    const cls = m.flagged ? "msg flagged" : `msg ${m.role}`;
    const roleLabel = m.role === "user" ? "User" : "Bot";
    const flag = m.flagged ? `<div class="flagged-label">▲ Flagged</div>` : "";
    return `<div class="${cls}">
      <div class="msg-role">${roleLabel}</div>
      <div class="msg-text">${escHtml(m.text)}</div>
      ${flag}
    </div>`;
  }).join("");
}

function renderCatBtns(id) {
  const current = catFor(id);
  return CATEGORIES.map(c => {
    const active = current === c.id ? " active" : "";
    return `<button class="cat-btn${active}" data-cat="${c.id}" onclick="setCat('${id}','${c.id}')">${c.label}</button>`;
  }).join("");
}

function catLabel(catId) {
  const c = CATEGORIES.find(x => x.id === catId);
  return c ? c.label : "—";
}

function render() {
  const list = document.getElementById("card-list");
  list.innerHTML = "";

  corrections.forEach((c, i) => {
    const st = stateFor(c.id);
    const el = document.createElement("div");
    el.className = "card" + (st.done ? " done" : "");
    el.dataset.id = c.id;
    el.dataset.cat = catFor(c.id) || "";

    const hasDiff = c.correct && c.correct !== "." && c.correct !== "...";

    el.innerHTML = `
      <div class="card-header">
        <div class="card-meta">
          <div class="card-num">Correction ${i+1} of ${corrections.length} · ${c.thread.slice(0,12)}</div>
          <div class="reviewer-note">${escHtml(c.reviewerNote)}</div>
          <div class="card-phone">${escHtml(c.phone)}</div>
        </div>
      </div>

      <div class="card-body">

        <div>
          <div class="section-label">Category</div>
          <div class="cat-wrap">${renderCatBtns(c.id)}</div>
        </div>

        <div>
          <div class="section-label">Conversation context</div>
          <div class="chat-window">${renderChat(c.context)}</div>
        </div>

        ${hasDiff ? `
        <div class="diff-row">
          <div class="diff-box original">
            <div class="diff-label">Wrong response</div>
            <p>${escHtml(c.original)}</p>
          </div>
          <div class="diff-box correct">
            <div class="diff-label">Correct response</div>
            <p>${escHtml(c.correct)}</p>
          </div>
        </div>` : `
        <div class="diff-box original" style="grid-column:span 2">
          <div class="diff-label">Wrong response</div>
          <p>${escHtml(c.original)}</p>
        </div>`}

        <div class="action-section">
          <div class="section-label">Action plan</div>
          <textarea class="action-textarea"
            placeholder="What change needs to be made? Which file? What wording?"
            oninput="saveAction('${c.id}', this.value)"
          >${escHtml(st.action)}</textarea>
        </div>

      </div>

      <div class="card-footer">
        <span class="cat-badge" id="badge-${c.id}">${catLabel(catFor(c.id))}</span>
        <button class="btn-done${st.done ? " active" : ""}" onclick="toggleDone('${c.id}')">
          ${st.done ? "✓ Done" : "Mark Done"}
        </button>
      </div>
    `;

    list.appendChild(el);
  });

  updateStats();
  applyFilters();
}

// ── Actions ────────────────────────────────────────────────────────────────
function setCat(id, cat) {
  const st = stateFor(id);
  st.cat = st.cat === cat ? null : cat;
  save();
  // Re-render just this card's buttons + badge
  const el = document.querySelector(`.card[data-id="${id}"]`);
  el.dataset.cat = catFor(id) || "";
  el.querySelector(".cat-wrap").innerHTML = renderCatBtns(id);
  document.getElementById(`badge-${id}`).textContent = catLabel(catFor(id));
  applyFilters();
}

function saveAction(id, val) {
  stateFor(id).action = val;
  save();
}

function toggleDone(id) {
  const st = stateFor(id);
  st.done = !st.done;
  save();
  const el = document.querySelector(`.card[data-id="${id}"]`);
  el.classList.toggle("done", st.done);
  const btn = el.querySelector(".btn-done");
  btn.classList.toggle("active", st.done);
  btn.textContent = st.done ? "✓ Done" : "Mark Done";
  updateStats();
  applyFilters();
}

// ── Filters ────────────────────────────────────────────────────────────────
let activeTab = "all";

function setTab(btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  activeTab = btn.dataset.tab;
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById("search").value.toLowerCase();
  let visible = 0;
  document.querySelectorAll(".card").forEach(el => {
    const id  = el.dataset.id;
    const cat = el.dataset.cat;
    const st  = stateFor(id);
    const c   = corrections.find(x => x.id === id);
    const text = (c.reviewerNote + " " + c.original + " " + c.correct + " " + st.action).toLowerCase();

    let show = true;
    if (q && !text.includes(q)) show = false;
    if (activeTab === "pending" && st.done) show = false;
    if (activeTab === "done"    && !st.done) show = false;
    if (!["all","pending","done"].includes(activeTab) && cat !== activeTab) show = false;

    el.classList.toggle("hidden", !show);
    if (show) visible++;
  });
  document.getElementById("no-results").style.display = visible === 0 ? "block" : "none";
}

function updateStats() {
  const done    = corrections.filter(c => stateFor(c.id).done).length;
  const pending = corrections.length - done;
  document.getElementById("cnt-total").textContent   = corrections.length;
  document.getElementById("cnt-done").textContent    = done;
  document.getElementById("cnt-pending").textContent = pending;
}

// ── Export ─────────────────────────────────────────────────────────────────
function exportDone() {
  const out = corrections
    .filter(c => stateFor(c.id).done)
    .map(c => ({
      id:           c.id,
      thread:       c.thread,
      phone:        c.phone,
      category:     stateFor(c.id).cat,
      reviewerNote: c.reviewerNote,
      original:     c.original,
      correct:      c.correct,
      action:       stateFor(c.id).action,
    }));

  if (out.length === 0) { alert("Mark some corrections as Done first."); return; }

  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url; a.download = "corrections_actioned.json"; a.click();
  URL.revokeObjectURL(url);
}

function metaFor(id, field) {
  const stored = stateFor(id)[field];
  if (stored !== undefined && stored !== null) return stored;
  return (META[id] && META[id][field]) || "";
}

// Returns user-assigned category if set, otherwise falls back to META default
function catFor(id) {
  const st = stateFor(id);
  return st.cat !== null ? st.cat : (META[id] && META[id].defaultCat) || null;
}

function saveField(id, field, value) {
  stateFor(id)[field] = value;
  save();
}

// ── View switching ─────────────────────────────────────────────────────────
let activeView = "list";

function setView(name) {
  activeView = name;
  ["list", "categories", "fixes"].forEach(v => {
    document.getElementById("view-" + v).style.display = v === name ? "" : "none";
    document.getElementById("vbtn-" + v).classList.toggle("active", v === name);
  });
  if (name === "categories") renderCategoriesView();
  if (name === "fixes")      renderFixesView();
}

// ── Categories view ────────────────────────────────────────────────────────
function renderCategoriesView() {
  const container = document.getElementById("cat-list");

  // Group by assigned category
  const groups = {};
  corrections.forEach(c => {
    const cat = catFor(c.id) || "__none__";
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(c);
  });

  // Sort: named categories first (in CATEGORIES order), then uncategorised
  const orderedKeys = [...CATEGORIES.map(c => c.id), "__none__"].filter(k => groups[k]);

  container.innerHTML = orderedKeys.map(key => {
    const label = key === "__none__"
      ? "Uncategorised"
      : (CATEGORIES.find(c => c.id === key) || { label: key }).label;
    const items = groups[key];
    return `
      <div class="cat-group">
        <div class="cat-group-header">
          <h2>${escHtml(label)}</h2>
          <span class="cat-count">${items.length}</span>
        </div>
        <div class="cat-items">
          ${items.map(c => `
            <div class="cat-item">
              <span class="cat-item-id">${escHtml(c.id)}</span>
              <span class="cat-item-note">${escHtml(c.reviewerNote)}</span>
            </div>
          `).join("")}
        </div>
      </div>`;
  }).join("");
}

// ── Fix Recommendations view ───────────────────────────────────────────────
function renderFixesView() {
  const container = document.getElementById("fixes-container");

  const catOptions = `<option value="">— unset —</option>` +
    CATEGORIES.map(c => `<option value="${c.id}">${escHtml(c.label)}</option>`).join("");

  const rows = corrections.map((c, i) => {
    const currentCat = catFor(c.id) || "";
    const rootCause  = escHtml(metaFor(c.id, "rootCause"));
    const fix        = escHtml(metaFor(c.id, "fix"));

    const catSel = `<select class="fix-cat-select" onchange="setCat('${c.id}', this.value); renderCategoriesView();">
      ${CATEGORIES.map(cat =>
        `<option value="${cat.id}"${currentCat === cat.id ? " selected" : ""}>${escHtml(cat.label)}</option>`
      ).join("")}
      ${!currentCat ? `<option value="" selected>— unset —</option>` : ""}
    </select>`;

    return `<tr>
      <td class="fix-id">${escHtml(c.id)}</td>
      <td class="fix-note">${escHtml(c.reviewerNote)}</td>
      <td>${catSel}</td>
      <td>
        <div class="editable-cell" contenteditable="true"
          onblur="saveField('${c.id}','rootCause',this.innerText)"
        >${rootCause}</div>
      </td>
      <td>
        <div class="editable-cell" contenteditable="true"
          onblur="saveField('${c.id}','fix',this.innerText)"
        >${fix}</div>
      </td>
    </tr>`;
  }).join("");

  container.innerHTML = `
    <table class="fixes-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Reviewer Note</th>
          <th>Category</th>
          <th>Root Cause</th>
          <th>Proposed Fix</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

render();
</script>
